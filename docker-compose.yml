version: '3.8'

services:
  # Сервис 0: База данных PostgreSQL
  db:
    image: postgres:16-alpine # Используем легкую alpine-версию 16-й постгри
    container_name: second_brain_db
    restart: unless-stopped
    env_file:
      - .env # Берем пароли из .env файла
    volumes:
      - postgres_data:/var/lib/postgresql/data # КРИТИЧНО: сохраняем данные БД на хосте
    ports:
      - "5432:5432" # (Опционально) пробрасываем порт, если захочешь подключаться через DBeaver/DataGrip

  # Сервис 1: Ядро твоего приложения (Django)
  web:
    build: .
    container_name: second_brain_web
    working_dir: /app/ai_manager
    # Collect versioned assets before serving Django through the production WSGI server.
    command: bash -c "python manage.py collectstatic --noinput && gunicorn ai_manager.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    volumes:
      # Синхронизируем код: меняешь файл в VS Code -> он сразу меняется в Докере
      - .:/app
    environment:
      # ВАЖНО: Указываем Django, как найти Ollama на твоем компьютере Windows
      # - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_HOST=0.0.0.0:11434
      - DEBUG=True
    env_file:
      - .env
    depends_on:
      - db

  # Сервис 2: Сборщик стилей (Tailwind)
  tailwind:
    build: .
    container_name: second_brain_css
    # Команда запуска npm run dev в папке ai_manager
    command: bash -c "cd ai_manager && npm run dev"
    volumes:
      - .:/app

volumes:
  postgres_data: # Объявляем именованный том для базы данных